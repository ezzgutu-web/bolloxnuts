name: Deploy to 20i

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP to 20i
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ftp.gb.stackcp.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "index.html"
          target: "/public_html/"
          strip_components: 0
